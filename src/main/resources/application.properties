# ==============================================================================
# Monello71 — konfiguratsiya
#
# PRODUCTION'da bu fayl ishlatilmaydi. Server /opt/monello71/config/ dagi
# nusxani o'qiydi:
#   java -jar monello71.jar --spring.config.location=file:/opt/monello71/config/
# --spring.config.location jar ichidagi barcha default joylarni ALMASHTIRADI,
# shuning uchun quyidagi qiymatlar prod'ga ta'sir qilmaydi (faqat dev uchun).
# ==============================================================================

# --- JWT ---
jwt.secret=sqb1922jb
jwt.expirationMs=86400000

# --- Server ---
server.port=71

# --- Logging ---
logging.file.path=/opt/monello_log/monello71
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=7

# --- Datasource (Oracle) ---
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@192.168.1.197:1521/cdb1
spring.datasource.username=psbinsurance
spring.datasource.password=Qwerty123

# --- HikariCP ---
spring.datasource.hikari.minimumIdle=20
spring.datasource.hikari.maximumPoolSize=100
spring.datasource.hikari.idleTimeout=60000
spring.datasource.hikari.poolName=SpringBootJPAHikariCP
spring.datasource.hikari.maxLifetime=120000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.leak-detection-threshold=300000

# --- HTTP javob siqish ---
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# --- HTTP session ---
# Auth JWT orqali, lekin WebSecurityConfig'da STATELESS o'rnatilmagan,
# shuning uchun Spring Security baribir session yaratadi. 10m — xotira cheklovi.
server.servlet.session.cookie.max-age=10m
server.servlet.session.timeout=10m

# --- Fayl yuklash (multipart) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Request executor (config/ExecutorConfig.java) ---
executor.corePoolSize=500
executor.maxPoolSize=1200
executor.queueCapacity=0
executor.threadName=requestExecutor-
executor.setAliveSeconds=60

# ==============================================================================
# Chat (Text-to-SQL)
# Yoqishdan oldin: 1) db/chat_text_to_sql.sql ni bajaring (MONELLO_CHAT_RO user)
#                  2) chat.datasource.password va anthropic.api-key ni to'ldiring
# ==============================================================================
chat.enabled=false
chat.datasource.url=jdbc:oracle:thin:@192.168.1.197:1521/cdb1
chat.datasource.username=MONELLO_CHAT_RO
chat.datasource.password=
chat.datasource.pool-size=5
chat.max-rows=200
chat.query-timeout-seconds=30
chat.max-sql-retries=1

anthropic.api-key=
anthropic.model=claude-opus-5
